name: Build Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: Build firmware
      working-directory: ./Infiltra Firmware
      run: pio run

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-binaries
        path: ./Infiltra Firmware/files/*.bin
